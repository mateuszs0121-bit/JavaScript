<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gra w papier, kamień, nożyce</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>
  <body>
    <h1>PAPIER, KAMIEŃ, NOŻYCE</h1>

    <div>
      <h3>Wybierz swoją opcję:</h3>
      <img
        data-option="papier"
        class="first"
        src="paper.jpg"
        alt=""
        title="Papier"
      />
      <img data-option="kamień" src="rock.jpg" alt="" title="Kamień" />
      <img data-option="nożyce" src="scissors.jpg" alt="" title="Nożyce" />
    </div>

    <button class="start">Zagrajmy!</button>

    <div class="panel-left">
      <h3>Wyniki gry</h3>
      <p>Twój wybór: <span data-summary="your-choice"></span></p>
      <p>Wybór komputera: <span data-summary="ai-choice"></span></p>
      <h2>Zwycięzca: <span data-summary="winner"></span></h2>
    </div>

    <div class="panel-right">
      <h3>Aktualne wyniki</h3>
      <p class="numbers">Liczba gier: <span>0</span></p>
      <p class="wins">Wygranych gier: <span>0</span></p>
      <p class="losses">Przegranych gier: <span>0</span></p>
      <p class="draws">Remisów: <span>0</span></p>
    </div>
    <script src="main.js"></script>
  </body>
</html>
